name: Orbit Telemetry checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Run tests, coverage report, and fat JAR build
        run: gradle clean test jacocoTestReport shadowJar --no-daemon
      - name: Upload executable JAR
        uses: actions/upload-artifact@v4
        with:
          name: orbit-telemetry
          path: build/libs/orbit-telemetry.jar
          if-no-files-found: error
