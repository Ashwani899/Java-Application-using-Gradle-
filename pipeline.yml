name: Enterprise CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  checks: write

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 21 (Corretto)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'corretto'
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Gradle Build & Test (with Jacoco coverage)
        run: ./gradlew clean build shadowJar jacocoTestReport --no-daemon
        
      - name: Upload Production Artifact
        uses: actions/upload-artifact@v4
        with:
          name: orbit-telemetry-binary
          path: build/libs/orbit-telemetry.jar
